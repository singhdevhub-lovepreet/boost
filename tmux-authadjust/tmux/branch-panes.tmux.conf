# tmux-branch-panes — per-pane git-branch labels + branch-column grouping.
# Append to ~/.tmux.conf (or `source-file` it), then reload: tmux source-file ~/.tmux.conf
#
# Labels live on each pane's TOP border; color is hashed from the branch name so
# same-branch panes read as a group. Panes never move to other windows.

set -g status-position top          # branch/window tabs at the top
set -g pane-border-status top       # per-pane label bar on top of each pane
set -g pane-border-format " #[fg=#{?@tbp_color,#{@tbp_color},colour245}]#[bold]#{?pane_title,#{pane_title},#{pane_current_command}}#[default]  #P·#{pane_current_command} "

setw -g automatic-rename on          # window titling stays normal (labels are per-pane)
set -g allow-rename on

# Prefix + g : regroup every pane in the current session by its branch.
# NOTE: adjust the path if tmux-branch-group is not installed at ~/.local/bin.
bind g run-shell "~/.local/bin/tmux-branch-group --sweep"
